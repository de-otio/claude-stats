name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all packages
        run: npx tsc --build --force

      - name: Check locale parity
        run: npm run locales:check

      - name: Run tests
        run: npx vitest run --coverage

      - name: Per-directory coverage gate (crypto / sync-merge / org >=90% lines)
        run: node scripts/check-coverage-dirs.mjs

      - name: Infra stack synth tests
        run: npm test -w @de-otio/claude-stats-infra

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build core package
        run: npm run build -w packages/core

      - name: Package VS Code extension
        run: npm run package:ext

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: claude-stats-vscode-${{ github.sha }}
          path: extension/*.vsix

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w packages/frontend

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: packages/frontend/dist/
          retention-days: 1

  synth-cdk:
    name: CDK Synth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build core package
        run: npm run build -w packages/core

      - name: Build frontend
        run: npm run build -w packages/frontend

      - name: Build infra package
        run: npm run build -w packages/infra

      - name: CDK Synth (verify template generation)
        run: npx cdk synth --app "node packages/infra/dist/bin/app.js" -c env=dev --no-staging
        env:
          CDK_DEFAULT_REGION: us-east-1

  smoke-consumer-synth:
    name: Consumer-Synth Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Packs @claude-stats/core + the infra package as npm would publish
      # them, installs the tarballs offline into a throwaway consumer app,
      # and runs a real `cdk synth` (incl. NodejsFunction/esbuild bundling)
      # against them — catches "works in the monorepo, breaks once
      # tarballed" bugs that tsc/vitest cannot see. Offline by design (see
      # script header) so this stays deterministic even though CI has
      # network.
      - name: Consumer-synth smoke test
        run: node scripts/smoke-consumer-synth.mjs

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-frontend, synth-cdk]
    if: github.ref == 'refs/heads/master'
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Deploy to dev (placeholder)
        run: echo "Deploy to dev — configure AWS credentials and run cdk deploy here"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy-dev
    if: github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Deploy to prod (placeholder)
        run: echo "Deploy to prod — configure AWS credentials and run cdk deploy here"
