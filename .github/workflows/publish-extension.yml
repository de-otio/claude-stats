name: Publish VS Code Extension

on:
  push:
    tags:
      - "ext-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package only; do not publish"
        type: boolean
        default: false
      publish_from_run:
        # Retrying a failed publish should not cost five platform rebuilds.
        # The packaging matrix spans macOS (10x billing multiplier) and two
        # Windows runners (2x), so a rebuild-to-retry costs orders of
        # magnitude more billed minutes than the publish it is retrying —
        # and the VSIXes it produces are identical to the ones already
        # sitting on the failed run. Point this at that run instead and the
        # retry is a single ubuntu job.
        description: "Publish VSIXes from this existing run id instead of rebuilding (cheap retry). Artifacts expire after 30 days."
        type: string
        default: ""

permissions:
  contents: write
  # Reading another run's artifacts goes through the Actions API.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package VSIX (${{ matrix.target }})
    # Skipped entirely when reusing a previous run's artifacts. Written as an
    # explicit event test rather than relying on `inputs.x == ''` being true
    # when the inputs context is absent: if that coercion ever changed, a tag
    # push would silently skip packaging and publish nothing.
    if: github.event_name != 'workflow_dispatch' || inputs.publish_from_run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            # ARM64 hosted runner; if unavailable on the project's plan,
            # this leg fails fast and can be temporarily removed.
            os: ubuntu-24.04-arm
          - target: win32-x64
            os: windows-latest
          - target: win32-arm64
            # Windows ARM hosted runner; same caveat as above.
            os: windows-11-arm

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci

      - name: Build core package
        # @claude-stats/core has TS + JSON-locale outputs that the per-leg
        # esbuild step resolves via `exports`; without this it fails to
        # find ./dist/locales/<locale>/cli.json on every non-typecheck leg.
        run: npm run build -w packages/core

      - name: Typecheck (Linux x64 only — same answer on every leg)
        if: matrix.target == 'linux-x64'
        timeout-minutes: 10
        run: npx tsc --build --force

      - name: Run tests (Linux x64 only)
        if: matrix.target == 'linux-x64'
        timeout-minutes: 15
        run: npx vitest run

      # Cache the model file across legs and across runs. The cache key is
      # the sha256 of embeddings.ts so any rotation of MODEL_SHA256/_URL
      # invalidates the cache automatically. Per-target legs share the
      # same model file.
      - name: Cache embedding model
        id: cache-model
        uses: actions/cache@v6
        with:
          path: extension/media/embed-model
          key: embed-model-${{ hashFiles('packages/cli/src/recap/embeddings.ts') }}

      - name: Fetch embedding model
        if: steps.cache-model.outputs.cache-hit != 'true'
        # Large download from an external host — the classic hang candidate.
        timeout-minutes: 10
        run: node scripts/fetch-embedding-model.mjs

      - name: Build and package per-target VSIX
        timeout-minutes: 15
        run: node scripts/package-vsix.mjs --target=${{ matrix.target }}

      - name: Verify tag matches extension version
        if: startsWith(github.ref, 'refs/tags/ext-v') && matrix.target == 'linux-x64'
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#ext-v}"
          pkg_version=$(node -p "require('./extension/package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag version ($tag_version) does not match extension/package.json version ($pkg_version)"
            exit 1
          fi

      - name: Smoke-check VSIX contents
        timeout-minutes: 5
        run: node scripts/verify-vsix.mjs --target=${{ matrix.target }}

      - name: Upload VSIX artifact
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: claude-stats-vscode-${{ matrix.target }}
          path: extension/*.vsix
          retention-days: 30

  publish:
    name: Publish to VS Code Marketplace
    needs: package
    runs-on: ubuntu-latest
    # Slightly above the publish step's own 20-minute ceiling, so the step
    # timeout is what fires first and names the culprit in the log.
    timeout-minutes: 25
    # `needs: package` would normally skip this job when package is skipped,
    # which is exactly the publish_from_run case — hence the explicit
    # success-or-skipped test. !cancelled() rather than always() so a
    # cancelled run does not go on to publish.
    if: >-
      !cancelled()
      && (needs.package.result == 'success' || needs.package.result == 'skipped')
      && (github.event_name == 'push' || inputs.dry_run != true)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci

      - name: Download all per-target VSIXes
        timeout-minutes: 10
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: claude-stats-vscode-*
          # Defaults to this run; publish_from_run points it at an earlier
          # one. Reading across runs requires the token.
          run-id: ${{ inputs.publish_from_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded VSIXes
        run: |
          set -euo pipefail
          find artifacts -name '*.vsix' -print
          n=$(find artifacts -name '*.vsix' | wc -l | tr -d ' ')
          echo "found $n VSIX(es) to publish"
          # Without this the publish loop iterates zero times and reports
          # success, which would read as "released" having shipped nothing.
          if [ "$n" -eq 0 ]; then
            echo "::error::no VSIXes found. If using publish_from_run, check the run id is right and its artifacts have not passed the 30-day retention window."
            exit 1
          fi

      - name: Publish each per-target VSIX
        # Ceiling for the whole loop. Without it a wedged upload would sit
        # until the job timeout, burning billed minutes for nothing.
        timeout-minutes: 20
        env:
          VSCE_PAT: ${{ secrets.VSCODE_MARKETPLACE_PAT }}
        run: |
          set -euo pipefail

          # This loop publishes one VSIX per target platform, and it must be
          # safe to re-run. Three failure modes wedged the 0.18.1 release:
          #
          #  1. The marketplace intermittently rejects a perfectly valid
          #     upload — observed as both TF400898 ("An Internal Error
          #     Occurred") and "Request timeout: /_apis/gallery/...". These
          #     are service-side and clear on their own.
          #  2. A failure part-way through left earlier targets published.
          #     Re-running died on "already exists" before reaching the
          #     un-published ones, so the only way out was a version bump.
          #  3. The loop aborted on the first failing target, so the targets
          #     behind it were never attempted — a single flaky upload cost a
          #     whole run's worth of minutes and published nothing new.
          #
          # Hence: retry by DEFAULT and treat only a known-fatal set as
          # terminal. An allow-list of transient errors is the wrong shape
          # here — we do not control the marketplace's error vocabulary, and
          # guessing it wrong (as an earlier revision did with "Request
          # timeout") turns a retryable blip into a failed release.
          FATAL='invalid.*token|unauthorized|forbidden|40[13] |authentication failed|manifest|not a valid extension'

          publish_one() {
            local vsix="$1" attempt log backoff
            for attempt in 1 2 3; do
              log="$(mktemp)"
              if npx @vscode/vsce publish --packagePath "$vsix" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"

              # Already on the marketplace at this version: nothing to do.
              # This is what makes the job idempotent and re-runnable.
              if grep -qiE 'already exists|already published' "$log"; then
                echo "note: this target is already at this version — nothing to do"
                return 0
              fi

              # A rejected PAT or a bad package will not fix itself.
              if grep -qiE "$FATAL" "$log"; then
                echo "::error::fatal publish failure for $vsix — not retrying"
                return 1
              fi

              if [ "$attempt" -lt 3 ]; then
                backoff=$(( attempt * 30 ))
                echo "transient marketplace error; retrying in ${backoff}s (attempt ${attempt}/3)"
                sleep "$backoff"
              fi
            done
            echo "::error::$vsix still failing after 3 attempts"
            return 1
          }

          # Attempt every target even if an earlier one fails, so a single
          # flaky upload cannot strand the rest. Combined with the
          # already-published check above, each run makes forward progress
          # and a re-run only retries what is genuinely still missing.
          failed=()
          for vsix in $(find artifacts -name '*.vsix'); do
            echo "::group::Publishing $vsix"
            if ! publish_one "$vsix"; then
              failed+=("$vsix")
            fi
            echo "::endgroup::"
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]} target(s) failed to publish:"
            printf '  %s\n' "${failed[@]}"
            echo "Re-run with publish_from_run=${{ github.run_id }} once the marketplace recovers — already-published targets are skipped and nothing is rebuilt."
            exit 1
          fi
          echo "All targets published or already current."

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only on tag pushes — workflow_dispatch never makes a Release.
    if: startsWith(github.ref, 'refs/tags/ext-v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all per-target VSIXes
        timeout-minutes: 10
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: claude-stats-vscode-*
          run-id: ${{ inputs.publish_from_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Flatten VSIX layout
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -name '*.vsix' -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Extract changelog section for this tag
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#ext-v}"
          node scripts/extract-changelog.mjs "$version" > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.notes.outputs.version }}"
          tag="${GITHUB_REF_NAME}"
          # Idempotent: if a release already exists at this tag, upload
          # the VSIXes to it (clobber) and skip the create step.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading assets with --clobber"
            gh release upload "$tag" release-assets/*.vsix --clobber
          else
            gh release create "$tag" \
              --title "VS Code Extension $version" \
              --notes-file release-notes.md \
              release-assets/*.vsix
          fi
